name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      APK_PATH: app/build/outputs/apk/release/app-release.apk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Dependencies
        working-directory: ./mobile
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild
        working-directory: ./mobile
        run: |
          npx expo prebuild --platform android --no-install --non-interactive
          # Apply memory fix even to debug build
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "android.enablePngCrunchInReleaseBuilds=false" >> android/gradle.properties

      - name: Create local.properties
        working-directory: ./mobile/android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Grant gradlew permission
        working-directory: ./mobile/android
        run: chmod +x gradlew

      # 🔥 STANDALONE RELEASE BUILD (Barqaror va kichik hajm uchun)
      - name: Build Standalone APK (Release)
        working-directory: ./mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find and Verify APK
        working-directory: ./mobile/android
        run: |
          echo "Searching for APK files..."
          find . -name "*.apk"
          ORIGINAL_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$ORIGINAL_APK" ]; then
            echo "Error: APK not found!"
            exit 1
          fi
          # Faqat nomi boshqacha bo'lsa qayta nomlaymiz (aks holda mv xato beradi)
          TARGET_APK="app/build/outputs/apk/release/app-release.apk"
          if [ "$ORIGINAL_APK" != "$TARGET_APK" ]; then
            mv "$ORIGINAL_APK" "$TARGET_APK"
          fi
          echo "APK_PATH=$TARGET_APK" >> $GITHUB_ENV

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Smart-SES-Standalone-App
          path: mobile/android/${{ env.APK_PATH }}

      - name: Publish Direct Download (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Smart SES Build (Standalone Release)
          body: "Automated STANDALONE RELEASE build from main branch. This version is optimized and smaller."
          files: mobile/android/${{ env.APK_PATH }}
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
