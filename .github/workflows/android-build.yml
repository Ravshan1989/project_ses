name: Build Android APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: wrapper

      - name: Install Dependencies
        working-directory: ./mobile
        run: npm install

      - name: Prebuild (Apply Branding)
        working-directory: ./mobile
        run: npx expo prebuild --platform android --clean

      - name: Build APK (Release)
        working-directory: ./mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Smart-SES-App
          path: mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Publish Direct Download (Release)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Smart SES Build
          body: "Automated Release build from main branch."
          files: mobile/android/app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
