name: Build Android APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Dependencies
        working-directory: ./mobile
        run: npm install --legacy-peer-deps

      - name: Clean and Prebuild
        working-directory: ./mobile
        run: |
          rm -rf android
          npx expo prebuild --platform android --no-install --non-interactive
          # Remove any existing settings to avoid duplicates
          sed -i '/org.gradle.jvmargs/d' android/gradle.properties
          sed -i '/org.gradle.daemon/d' android/gradle.properties
          sed -i '/android.enablePngCrunchInReleaseBuilds/d' android/gradle.properties
          sed -i '/org.gradle.parallel/d' android/gradle.properties
          # Add optimized settings
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "android.enablePngCrunchInReleaseBuilds=false" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties
          echo "android.nonTransitiveRClass=true" >> android/gradle.properties
          echo "Done patching gradle.properties"
          cat android/gradle.properties

      - name: Build APK (Release)
        working-directory: ./mobile/android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace --info

      - name: Find and Verify APK
        working-directory: ./mobile/android
        run: |
          echo "Searching for APK files..."
          find . -name "*.apk"
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found!"
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Smart-SES-App
          path: mobile/android/${{ env.APK_PATH }}

      - name: Publish Direct Download (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Smart SES Build
          body: "Automated Release build from main branch."
          files: mobile/android/${{ env.APK_PATH }}
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
